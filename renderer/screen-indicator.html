<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <title>Cockpit · screen control</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      /* the whole pill moves the window; the buttons do not */
      #pill {
        -webkit-app-region: drag;
        box-sizing: border-box;
        height: 34px;
        margin: 3px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 6px 0 12px;
        border-radius: 17px;
        background: rgba(40, 10, 12, 0.92);
        border: 2px solid #ff4d4f;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        color: #ffd6d6;
        font-size: 12.5px;
        white-space: nowrap;
        position: relative;
        overflow: hidden;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      #pill > * {
        position: relative;
        z-index: 1;
      }
      /* something RUNS: an action lights the pill up (glow + a light sweeping across), a read is
         quieter; every new action flashes once, so a run of quick keys is seen as a run */
      #pill.act {
        background: rgba(160, 14, 22, 0.97);
        border-color: #ff7375;
        color: #fff;
        animation: glow 0.6s ease-in-out infinite alternate;
      }
      #pill.look {
        background: rgba(70, 14, 18, 0.95);
        border-color: #ff8a8c;
        color: #ffe3e3;
      }
      @keyframes glow {
        from {
          box-shadow: inset 0 0 4px rgba(255, 140, 140, 0.4), 0 4px 14px rgba(0, 0, 0, 0.45);
        }
        to {
          box-shadow: inset 0 0 14px rgba(255, 170, 170, 0.95), 0 4px 14px rgba(0, 0, 0, 0.45);
        }
      }
      #pill::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
        transform: translateX(-100%);
        opacity: 0;
      }
      #pill.act::after {
        opacity: 1;
        animation: sweep 0.9s linear infinite;
      }
      #pill.look::after {
        opacity: 0.5;
        animation: sweep 1.8s linear infinite;
      }
      @keyframes sweep {
        to {
          transform: translateX(100%);
        }
      }
      #pill::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: #fff;
        opacity: 0;
      }
      #pill.flash::before {
        animation: flash 0.4s ease-out;
      }
      @keyframes flash {
        from {
          opacity: 0.5;
        }
        to {
          opacity: 0;
        }
      }
      #icon {
        display: none;
        flex: 0 0 auto;
        font-size: 15px;
        line-height: 1;
      }
      #pill.act #dot,
      #pill.look #dot {
        display: none;
      }
      #pill.act #icon,
      #pill.look #icon {
        display: inline-block;
      }
      #icon.mouse {
        animation: wiggle 0.5s ease-in-out infinite;
      }
      #icon.keys {
        animation: tap 0.25s ease-in-out infinite alternate;
      }
      #icon.other {
        animation: beat 0.9s ease-in-out infinite;
      }
      @keyframes wiggle {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(3px, -2px); }
        50% { transform: translate(-2px, 2px); }
        75% { transform: translate(2px, 2px); }
      }
      @keyframes tap {
        to { transform: translateY(2px) scale(0.88); }
      }
      @keyframes beat {
        50% { transform: scale(1.18); }
      }
      #pill.act #text b {
        color: #fff;
      }
      #idle {
        color: #c99a9b;
      }
      #dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff4d4f;
        animation: blink 1.4s ease-in-out infinite;
        flex: 0 0 auto;
      }
      @keyframes blink {
        50% {
          opacity: 0.25;
        }
      }
      #text {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #text b {
        color: #fff;
      }
      button {
        -webkit-app-region: no-drag;
        flex: 0 0 auto;
        border: none;
        border-radius: 12px;
        background: #ff4d4f;
        color: #fff;
        font: 600 12px "Segoe UI", system-ui, sans-serif;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover {
        background: #ff7072;
      }
      button.small {
        background: rgba(255, 255, 255, 0.12);
        color: #ffd6d6;
        font-weight: 500;
      }
      button.small:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      #stepbtn.on {
        background: #ffb020;
        color: #2a1a00;
      }
      /* the step question, under the pill */
      #ask {
        box-sizing: border-box;
        margin: 0 3px 3px;
        padding: 8px 12px 9px;
        border-radius: 12px;
        background: rgba(40, 10, 12, 0.95);
        border: 2px solid #ffb020;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        color: #ffe7c2;
        font-size: 12.5px;
      }
      #ask.teach {
        border-color: #3ecf8e;
        color: #d4f7e6;
      }
      #ask.teach #ok {
        background: #3ecf8e;
        color: #00301c;
      }
      #ask.teach #askprev {
        font: 12px "Segoe UI", system-ui, sans-serif;
        color: #bfe9d4;
      }
      button[hidden] {
        display: none;
      }
      #ask[hidden] {
        display: none;
      }
      #askwhat {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #askwhat b {
        color: #fff;
      }
      #askprev {
        margin-top: 3px;
        font: 12px Consolas, monospace;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #askprev:empty {
        display: none;
      }
      #askrow {
        margin-top: 7px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #ok {
        background: #ffb020;
        color: #2a1a00;
        padding: 4px 16px;
      }
      #ok:hover {
        background: #ffc04d;
      }
      #askkey {
        margin-left: auto;
        color: #d9b98a;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <div id="pill">
      <span id="dot"></span><span id="icon"></span>
      <span id="text">Screen control</span>
      <button id="stepbtn" class="small" title="Step mode: every click, key and typing waits for your OK">Step</button>
      <button id="stop" title="Stop: every terminal loses screen control at once">Stop</button>
    </div>
    <div id="ask" hidden>
      <div id="askwhat"></div>
      <div id="askprev"></div>
      <div id="askrow">
        <button id="ok">OK</button><button id="skip" class="small">Skip</button
        ><button id="all" class="small" title="Step mode off for this terminal - it runs without asking">Let it run</button>
        <span id="askkey"></span>
      </div>
    </div>
    <script src="screen-indicator.js"></script>
  </body>
</html>
